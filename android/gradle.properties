# DW4_PC for Android (docs/ANDROID.md).
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
# Plain Android framework classes only: no AndroidX, no Kotlin.
android.useAndroidX=false
android.nonTransitiveRClass=true
# Never download SDK packages (platforms, build tools, NDK, CMake) on its own:
# a missing package stops the build instead (docs/ANDROID.md, Toolchain).
android.builder.sdkDownload=false
