// DW4_PC for Android (docs/ANDROID.md): a Gradle wrapper around the root
// CMakeLists.txt. --offline works only while the Gradle cache holds the
// Android Gradle Plugin and its dependencies; one online run fills it
// ("Gradle offline" in docs/ANDROID.md).
pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
    }
}
rootProject.name = 'DW4_PC'
include ':app'
